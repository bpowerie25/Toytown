name: Pages

# Deploys the examples to GitHub Pages. Enable Pages (Settings → Pages → Source: GitHub Actions)
# and set the repository variable PAGES_ENABLED=true; until then the site is built but not
# deployed.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 12.6.0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Assemble the site
        run: |
          mkdir -p site
          cp examples/site/index.html docs/demo.gif site/
          cp -r examples/waterford/dist site/waterford
          cp -r examples/tramore/dist site/tramore
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    if: vars.PAGES_ENABLED == 'true'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5
