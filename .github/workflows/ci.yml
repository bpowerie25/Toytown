name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Lint, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 12.6.0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm build
      # The built packages must work in plain Node, not just through Vitest's module interop.
      - name: Smoke-test built packages in Node
        run: |
          node -e "import('./packages/core/dist/index.js').then((m) => console.log('toytown-gl exports', Object.keys(m).length))"
          node packages/cli/dist/index.js --version
      - run: pnpm test
      - run: pnpm typecheck
      - name: Build the model kit zip
        run: pnpm --filter @toytown/models zip
      - uses: actions/upload-artifact@v7
        with:
          name: toytown-models-zip
          path: packages/models/dist/*.zip

  models:
    name: Model generator reproduces the kit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.9'
          cache: pip
          cache-dependency-path: assets/generator/requirements.txt
      - run: pip install -r assets/generator/requirements.txt
      - run: python assets/generator/test_generator.py
      # Regenerates the whole kit (GLBs, manifest, preview.png) and fails if the committed kit
      # or manifest disagree with it.
      - run: python assets/generator/check_reproducible.py --keep regenerated-kit
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: regenerated-kit
          path: regenerated-kit/

  e2e:
    name: Example screenshots (Playwright)
    runs-on: ubuntu-latest
    # Same image as `pnpm test:e2e` locally, so baselines match pixel for pixel.
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      options: --ipc=host
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 12.6.0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: npx playwright test
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
