name: Model or pack request
description: A model, variant, prop or regional pack you'd like to see (or contribute)
labels: [models]
body:
  - type: textarea
    id: what
    attributes:
      label: What model?
      description: Category (e.g. post office, windmill), and a photo or sketch if you have one.
    validations:
      required: true
  - type: input
    id: tags
    attributes:
      label: OSM tags it should match
  - type: dropdown
    id: contribute
    attributes:
      label: Would you like to make it?
      options: ['Yes, I will follow docs/adding-models.md', 'No, just suggesting']
